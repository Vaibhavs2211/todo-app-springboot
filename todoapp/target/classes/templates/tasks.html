<!DOCTYPE Html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
        }

        .container{
            max-width: 700px;
        }

        h1{
            font-weight: 700;
            color: #2c3e50;
        }

        form{
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        input{
            border-radius: 10px !important;
        }

        button{
            border-radius: 10px !important;
        }

        .card{
            border: none;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover{
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .card-body{
            padding: 15px 20px;
        }

        .text-strikethrough{
            text-decoration: line-through;
            color: grey;
        }

        a.btn{
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">
    <h1 class="mt-5 text-center">Todo Application</h1>

    <form action="/" method="post" class="row mt-3">
        <div class="col-md-10">
            <input class="form-control form-control-lg" type="text" name="title" placeholder="Add a new task..." required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary btn-lg w-100">Add</button>
        </div>
    </form>
</div>


<div class="mt-4 d-flex flex-column align-items-center">

    <th:block th:each="task : ${tasks}">
        <div class="card mb-3 w-50">
            <div class="card-body d-flex justify-content-between align-items-center">
                <span th:classappend="${task.completed} ? 'text-strikethrough'"
                      th:text="${task.title}">Task Title</span>

                <div>
                    <a th:href="@{/{id}/toggle(id=${task.id})}" class="btn btn-outline-secondary btn-sm">Toggle</a>
                    <a th:href="@{/{id}/delete(id=${task.id})}" class="btn btn-outline-danger btn-sm ms-2">Delete</a>
                </div>
            </div>
        </div>
    </th:block>

</div>

</body>
</html>
